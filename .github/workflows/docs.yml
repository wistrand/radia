# The docs' own guard, for commits that touch nothing else: the published site, and since
# 2026-09-05 `agent_docs/` and every markdown file, because `test/agentdocs.test.ts` (links, source
# paths, the em-dash ledger, CLAUDE.md's budget) guards exactly the changes `ci.yml` skips, and a
# prose-only commit ran no workflow at all.
#
# `ci.yml` ignores `docs/**`, because three jobs, an apt-install and three containers is a poor
# trade for a typo. What the site actually needs is `test/docs.test.ts` (its CLI verbs
# against `src/surfaces/cli.ts`, its imports against the npm exports map, links, anchors, sidebar
# labels, external hosts, banned prose) plus `http.test.ts`, which pins the served favicon to
# `docs/favicon.svg`. Both are in `deno task test:quick`, which runs in about a second.
#
# This is also the only check standing between a docs commit and `pages.yml` publishing it, which
# is why it exists rather than the filter alone.

name: docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'agent_docs/**', '**/*.md']
  pull_request:
    paths: ['docs/**', 'agent_docs/**', '**/*.md']

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      # The structural guards only: no PGlite boot, no sockets, no timers.
      - run: deno task test:quick
