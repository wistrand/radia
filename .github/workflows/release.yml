# Publish the binaries `docs/install.sh` downloads.
#
# On a `v*` tag: build every target, gzip each one, write SHA256SUMS, and attach the lot to the
# GitHub release. The installer resolves `releases/latest/download/radia-<target>.gz`, so the asset
# NAMES here are a contract with that script; `test/docs.test.ts` checks the two agree.
#
# One job, no matrix: `deno compile --target` cross-compiles, so one runner produces all four
# (Linux and macOS, x64 and arm64; native Windows is unsupported, WSL2 runs the Linux binary).
#
# The npm and pip SDK packages `deno task release` stages publish here too, as RELEASE ASSETS
# rather than registry uploads: radia-<version>.tgz (`npm pack`) and
# radia_space-<version>-py3-none-any.whl (`scripts/build-wheel.py`, stdlib only), covered by the
# same SHA256SUMS and installed by pinned URL. No registry account or credential exists to
# compromise; registry publishing is deferred, not ruled out (design-storage.md "Distribution"
# has the reasons and the trusted-publishing re-entry path). A published SDK asset is never
# re-uploaded: npm lockfile integrity and pip
# `#sha256` pins break retroactively, so a bad asset means a new release, not a clobber.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      # A tag that disagrees with the build cannot be corrected after publishing: the artifacts
      # claim one version while `radia version` reports another, and the installer hands people a
      # binary that misreports itself. Refuse before building.
      - name: the tag is the version this build reports
        run: |
          declared="$(deno eval 'import { VERSION } from "./src/version.ts"; console.log(VERSION)')"
          if [ "refs/tags/v$declared" != "$GITHUB_REF" ]; then
            echo "tag $GITHUB_REF does not match src/version.ts ($declared). Bump deno.json and src/version.ts together." >&2
            exit 1
          fi

      # The release workflow runs on tag pushes, which the ci workflow's branch filter never
      # matches, so nothing else stands between a red tree and published assets. The full matrix
      # already ran for the same commit's branch push; this refuses the tag when the tree does not
      # even type-check (v2026.8.4 shipped exactly that way, broken in examples/).
      - run: deno task check

      - run: deno task release

      # Both SDK packages are smoke-installed before upload: a malformed tarball or wheel RECORD
      # otherwise surfaces at the user's install, where nothing here can see it. The wheel builder
      # is stdlib-only, so this step fetches nothing from PyPI.
      - name: pack the SDKs
        run: |
          mkdir -p dist/assets
          (cd dist/npm/radia && npm pack --pack-destination ../../assets)
          python3 scripts/build-wheel.py dist/pypi dist/assets
          npm install --prefix /tmp/npm-smoke "$PWD"/dist/assets/radia-*.tgz
          python3 -m pip install --quiet --no-deps --no-index --target /tmp/pip-smoke dist/assets/radia_space-*.whl
          PYTHONPATH=/tmp/pip-smoke python3 -c "import radia; radia.RadiaClient; radia.ext"

      - name: gzip the binaries and write the sums
        run: |
          mkdir -p dist/assets
          for dir in dist/bin/*/; do
            target="$(basename "$dir")"
            gzip -9 -c "$dir/radia" > "dist/assets/radia-$target.gz"
          done
          # Bare names, not `./name`: this file is read by `docs/install.sh` and by people.
          cd dist/assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      # The installer reads SHA256SUMS from the release, so it has to be an asset, not a log line.
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF#refs/tags/}" --generate-notes dist/assets/* || gh release upload "${GITHUB_REF#refs/tags/}" dist/assets/* --clobber
