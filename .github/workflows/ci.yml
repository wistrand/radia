# CI. The reason this file exists is one line in CLAUDE.md: the conformance suite runs against
# EVERY implementation of every port "in CI from day one", and that was the only guard named by an
# invariant while not actually running anywhere. The claim-fairness bug that motivated the invariant
# was invisible on both embedded adapters and appeared only against a live server, so a green
# embedded run is not evidence about the adapter people deploy.
#
# Two jobs on purpose. `embedded` is the fast answer (no services, ~30s); `postgres` is the one the
# invariant is about, and a failure there names the adapter rather than "the tests".

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  embedded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          # Not pinned to a patch: the SQLite adapter rides Deno's built-in `node:sqlite`, which is
          # still marked unstable upstream (see agent_docs/gotchas.md), so an upgrade breaking it is
          # something to learn here rather than on someone's machine.
          deno-version: v2.x
      - run: deno task check
      - run: deno task conformance
      # bubblewrap is an OPTIONAL execution backend (a space advertises it only where its probe comes
      # back clean), and the suite skips its cases where the jail cannot run. BEST EFFORT here, never
      # fatal, and MEASURED: a hosted runner turned out not to support it.
      #
      # What happens on ubuntu-latest, verified: the binary installs, `--version` answers, the user
      # namespace is created — and `--unshare-all` then dies with
      # `bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted`, because Ubuntu's AppArmor
      # profile permits the namespace while withholding the capability to configure `lo` inside it.
      # So "installed" and "allowed" differ by more than one sysctl, and asserting the capability
      # only turned a skip into a red build.
      #
      # The sysctl below is the documented relaxation and may be enough on some images; if it is
      # not, the verdict step says so and the run continues. That is deliberately not a silent skip:
      # the log states whether bubblewrap coverage is ON or OFF, so a green build never implies
      # coverage it does not have. Real coverage for this backend comes from a machine (or
      # self-hosted runner) with unprivileged user namespaces.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: bubblewrap coverage verdict (never fatal)
        run: |
          if bwrap --unshare-all --ro-bind / / /bin/true 2>/tmp/bwrap.err; then
            echo "bubblewrap: ON — the sandbox cases will RUN"
          else
            echo "bubblewrap: OFF — the sandbox cases will SKIP. Reason:"
            cat /tmp/bwrap.err
          fi
      - run: deno task extensions

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radia
          POSTGRES_PASSWORD: radia
          POSTGRES_DB: radia
        ports: ["5432:5432"]
        # The runner starts the container before the steps, but Postgres accepts connections a
        # moment after the container exists; without this the first DDL races an unready server.
        options: >-
          --health-cmd "pg_isready -U radia -d radia"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The suite adds the `postgres` adapter when RADIA_PG_URL is set, each test in an ephemeral
      # schema dropped on close, so this is the same command with one more column. It is also the
      # ONLY cover for the pool-only paths: `SKIP LOCKED` claims racing across connections, and the
      # `xid8` watermark that keeps watch cursors gap-free when transactions commit out of seq order.
      - run: deno task conformance
        env:
          RADIA_PG_URL: postgres://radia:radia@localhost:5432/radia
