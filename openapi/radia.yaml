openapi: 3.1.0
info:
  title: Radia
  version: 0.1.0
  description: >
    Content-routed coordination runtime. This is the frozen wire contract; the runtime
    implements it (not the reverse). Freeze policy (see
    agent_docs/plan-m0-implementation.md "OpenAPI freeze policy"): the data-plane core is
    v0-stable and additive-only; kinds are declared through it (a `kind_def` record, no kinds
    endpoint). The observability+control plane under `/v0/ops/*` (stats, events, diagnostics,
    record + envelope introspection, remediation) is experimental and grant-gated (with real
    auth). Per-element stability is
    `x-stability`. SemVer 0.x means the surface may still move; the additive-only rule is
    what makes the stable subset dependable.

    Limits enforced at commit, each bounding a cost that BYTES do not. Records: body bytes
    (`413 record_too_large`, default 1 MiB, over the serialized JSON), nesting depth
    (`413 body_too_deep`, default 32) and array length (`413 array_too_long`, default 4096), because
    the matcher, the event chain and every reader walk the whole shape. Patterns: `$and`/`$or`
    nesting depth <= 3 (`too_deep`), serialized size (`413 pattern_too_large`, 8 KiB), compiled
    predicate count (`too_many_predicates`, 64), `$or` branches (`too_many_branches`, 16) and `$in`
    values (`too_many_values`, 256) — a pattern is STORED and then evaluated against every candidate
    record, so its cost is paid per record rather than once. Per principal: watches
    (`429 too_many_watches`, 64) and registered interests per kind (`429 too_many_interests`, 32).
    Artifacts: `413 artifact_too_large`, default 32 MiB. The gap between the artifact and body byte
    limits is the signal: a body approaching artifact size is a payload in the wrong place, and
    unlike an artifact a body can never be erased.

    Reads carry one more, and it is the only limit a caller cannot see in its own request:
    `429 scan_budget_exceeded`, default 200 000 rows. A pattern the database cannot decide (see the
    pushdown rules; `$each` is the operator that reaches this) is answered by walking the kind one
    record at a time, so its cost is the size of the kind rather than of the request. Anything
    decided in SQL returns matches rather than candidates and never approaches it. Narrow the
    pattern, page it with `after`, or declare the path the predicate uses. Per space it is
    `radia dev --max-scan-rows <n>` (`0` disables it), so this is the one limit here whose value a
    client cannot assume.

    Authorization (M1): kind-scoped grants are reserved `grant` records (assigned by an operator
    or the supervisor; discovered by query). Requests authenticate with `Authorization: Bearer
    <run-token>` minted through the bootstrap chain (agent-definitions → agent-runs → stop); a
    run:* principal inherits its definition's grants. A definition's principal may be agent:* or
    human:*, so a person gets a session the same way a worker does; the namespace never confers
    privilege, which is the space's named operator set. `GET /v0/ops/permissions` maps a run back
    to that subject and reports what it may do, and any principal may ask about ITSELF. `Authorization: Bearer` is the only
    auth channel. Absent a credential the caller defaults to the operator `human:local` (act as a
    scoped principal by minting a real run token). `put`/`take`/`query`/`read_one` are
    grant-checked; `/v0/ops/*` and writing `grant`/`signal`/`agent_*` records require an operator
    (`403`); an invalid/expired/stopped bearer token is `401`.

    Implemented through M0 (Phases 0-6) plus M1 watches + grants + the auth bootstrap chain / run
    tokens + artifacts (blob storage, unencrypted in v1). Not implemented yet: OIDC,
    scheduler admission, request/bid/award, keyset query cursor, the event-log sweep itself (the
    410 cursor_expired check is live but never fires until a sweep creates a horizon).

servers:
  - url: /v0

# Deferred matching operators are reserved now so adding them later is not breaking:
# $ne, $nin, $not, $prefix, full-text. $regex/$where/$expr are never added (patterns are
# data, not code).
x-reserved-operators: ["$ne", "$nin", "$not", "$prefix", "$text"]

paths:
  /health:
    get:
      operationId: health
      summary: Liveness + storage backend + DB clock
      x-stability: stable
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  version: { type: string }
                  api: { type: string }
                  storage: { type: string }
                  now: { type: string }
                  principal: { type: string, description: "the resolved caller (from the bearer token, or the operator default)" }

  # --- Data plane: FROZEN v0-stable, additive-only ------------------------------------

  /records:
    post:
      operationId: put
      summary: Commit an immutable record
      description: >
        Server assigns all authoritative metadata (created_by, created_at, schema_version,
        taint); client-submitted authoritative fields are ignored. `Idempotency-Key` header
        makes the put replayable (same key -> same id; different request -> 409).
      x-stability: stable
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string } }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /records/read-one:
    post:
      operationId: readOne
      summary: First matching record, or null (pattern in body, never query string)
      x-stability: stable
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Pattern" }
      responses:
        "200":
          description: record or null
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/Record" }
                  - { type: "null" }
        "400": { $ref: "#/components/responses/Problem" }

  /records/query:
    post:
      operationId: query
      summary: Matching records ordered by the pattern, capped at limit
      description: >
        Ordered by the pattern, capped at limit. `after`/`dir` are KEYSET pagination over record
        id: a cursor, not an offset, so a page stays correct while records are being written.
        Records without an explicit order_by come back in ASCENDING id order, so a plain limit
        returns the OLDEST matches; `dir: desc` is what expresses "the newest N". A cursor is
        defined for that natural id order only. Combining after/dir with order_by is a 400,
        because a keyset over a body field would need the whole sort key plus the matcher's type
        rules. Note that ids order by time only to the millisecond (ULID), so `desc` is
        newest-first at that resolution, not a strict write order.
      x-stability: stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/Pattern" }
                - type: object
                  properties:
                    limit: { type: integer, default: 100, maximum: 500 }
                    after:
                      type: string
                      description: Exclusive record-id cursor, read in the direction of `dir` (the last id of the previous page).
                    dir:
                      type: string
                      enum: [asc, desc]
                      default: asc
                      description: Direction of the natural (record id) order.
      responses:
        "200":
          description: page
          content:
            application/json:
              schema:
                type: object
                properties:
                  records: { type: array, items: { $ref: "#/components/schemas/Record" } }
                  nextAfter:
                    type: string
                    description: Cursor for the next page; absent on the last page (a short page ends the walk).
                  scope:
                    type: object
                    description: >
                      Present ONLY when the caller's grants narrowed this read; absent otherwise, so an
                      unrestricted read is byte-identical to before. `narrowedBy` lists the grant patterns
                      ANDed into the request and `ownRecordsOnly` marks an author restriction. Without it a
                      narrowed read is indistinguishable from a complete one, and callers report their slice
                      as the whole kind.
                    properties:
                      narrowedBy: { type: array, items: { type: object, additionalProperties: true } }
                      ownRecordsOnly: { type: boolean }
                      note: { type: string }
        "400": { $ref: "#/components/responses/Problem" }

  /takes:
    post:
      operationId: take
      summary: Atomically claim a record for a fenced lease
      description: >
        Selector is a pattern or a specific recordId (a selector, not a bypass; the
        server re-verifies availability and, if given, the pattern). Returns
        {record, lease} or null when nothing is claimable. Long-poll blocking is not
        implemented in M0.
      x-stability: stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pattern: { $ref: "#/components/schemas/Pattern" }
                recordId: { type: string }
                leaseSeconds: { type: number }
                allowTaint: { type: array, items: { type: string }, description: "the classification labels a candidate may carry and still be claimed (file, net, foreign). An ALLOWLIST, so a label added later bars the claim rather than being silently admitted. [] accepts only unclassified records and is the strictest barrier, NOT the absence of one; omit the field for no barrier. Intersected with whatever the caller's grants impose." }
                requireUntainted: { type: boolean, description: "deprecated spelling of allowTaint: []" }
      responses:
        "200":
          description: "{record, lease} or null"
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/TakeResult" }
                  - { type: "null" }
        "400": { $ref: "#/components/responses/Problem" }

  /leases/renew:
    post:
      operationId: renew
      summary: Extend a held lease, clamped to the cumulative hard cap
      x-stability: stable
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease]
              properties:
                lease: { $ref: "#/components/schemas/Lease" }
                leaseSeconds: { type: number }
      responses:
        "200":
          description: "{status: ok, lease} or {status: lease_lost}"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenewResult" }
        "409": { $ref: "#/components/responses/Problem" }

  /leases/ack:
    post:
      operationId: ack
      summary: Consume the record and optionally emit a result record (atomic)
      description: "`lease_lost` and `idempotency_conflict` are distinct outcomes; a fenced ack emits nothing."
      x-stability: stable
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease]
              properties:
                lease: { $ref: "#/components/schemas/Lease" }
                result: { $ref: "#/components/schemas/PutRequest" }
      responses:
        "200":
          description: "{status: ok, resultId?} or {status: lease_lost}"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AckResult" }
        "409": { $ref: "#/components/responses/Problem" }

  /leases/nack:
    post:
      operationId: nack
      summary: Retryable failure; attempt +1, backoff, dead-letter past max
      x-stability: stable
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease]
              properties:
                lease: { $ref: "#/components/schemas/Lease" }
                backoffSeconds: { type: number }
      responses:
        "200":
          description: "{status: ok | lease_lost}"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettleResult" }
        "409": { $ref: "#/components/responses/Problem" }

  /leases/release:
    post:
      operationId: release
      summary: Cooperative cancel; attempt +0, immediately available
      x-stability: stable
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease]
              properties: { lease: { $ref: "#/components/schemas/Lease" } }
      responses:
        "200":
          description: "{status: ok | lease_lost}"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettleResult" }
        "409": { $ref: "#/components/responses/Problem" }

  /artifacts:
    post:
      operationId: putArtifact
      summary: Store bytes and commit the artifact record that references them
      description: |
        The body is the raw payload; `Content-Type` becomes the artifact's media type. The bytes go
        to the blob store (content-addressed by sha256 of the plaintext) and an `artifact` record is
        committed carrying `{digest, mediaType, size, filename?}`. The record routes; the payload
        does not travel inside it. `digest` and `size` are server-computed, never client-submitted.
        Authorized as a `put` on the reserved `artifact` kind; a pattern-scoped grant is matched
        against the metadata body (so a grant can be limited to one media type).
      x-stability: stable
      x-phase: "M1"
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
        - { name: X-Radia-Filename, in: header, required: false, schema: { type: string }, description: "Advisory download name; never used as a path." }
        - { name: X-Radia-Parent-Ids, in: header, required: false, schema: { type: string }, description: "Comma-separated data lineage parents." }
        - { name: X-Radia-Taint, in: header, required: false, schema: { type: string }, description: "Comma-separated classification labels the client RAISES on its own output (file, net, foreign). Raising is monotone, so it needs no trust; an unrecognized label is refused rather than ignored. A client can never clear one." }
        - { name: X-Radia-Meta, in: header, required: false, schema: { type: string }, description: "ASCII JSON object of APPLICATION fields merged into the artifact's record body (scalars only; digest/mediaType/size/filename are runtime-computed and rejected here). This is what lets a pattern-scoped grant bind an artifact to something the app owns. The rest of the body is the runtime's." }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: stored
          content:
            application/json:
              schema:
                type: object
                required: [id, digest, size]
                properties:
                  id: { type: string, description: "the artifact record id, which is the stable reference" }
                  digest: { type: string, description: "sha256 hex of the plaintext bytes" }
                  size: { type: integer }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "413": { description: "artifact_too_large", $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /artifacts/{id}:
    get:
      operationId: getArtifact
      summary: An artifact's bytes
      description: |
        Authorized as `read_one` on the `artifact` kind, or by a `capability` query parameter
        (below) for callers that cannot set an Authorization header. The id is a stable record id,
        never a signed URL, because a URL would expire inside an immutable record.
      x-stability: stable
      x-phase: "M1"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: capability, in: query, required: false, schema: { type: string }, description: "A short-lived, single-artifact download capability." }
      responses:
        "200":
          description: the bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "410":
          description: the content was deliberately erased; the record and its lineage remain
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
    head:
      operationId: headArtifact
      summary: An artifact's digest, media type and size, without its bytes
      description: |
        The same authorization and the same headers as `GET`, with no body: `ETag` carries the
        content digest, `Content-Type` the media type, `Content-Length` the size. This is the
        metadata read of the coordination plane. Reading a record by id is otherwise only possible
        through `GET /ops/records/{id}`, which is operator-only, so any worker needing an artifact's
        digest had to either download it or reach for a plane it cannot use. An erased artifact
        answers 410 here exactly as it does for GET, so metadata is never reported for bytes that
        are gone.
      x-stability: stable
      x-phase: "M1"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "headers only: ETag is the digest" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "410": { description: the content was deliberately erased }
  /a/{capability}:
    get:
      operationId: getArtifactByCapability
      summary: An artifact's bytes, by capability alone (the short form)
      description: |
        The same bytes as `GET /artifacts/{id}?capability=…`, addressed by the capability only. A
        capability names exactly one record, so the id in the path was redundant; this form exists
        because the URL is handed to a person, who pastes it and sometimes reads it aloud, and the
        long form spent ~70 characters on nothing. No Authorization header: the capability IS the
        authorization, and none is accepted here. When an isolated artifact origin is configured
        this is the origin the minted URL points at, so scriptable media renders somewhere that
        shares nothing with the console.
      x-stability: experimental
      x-phase: "M1"
      parameters:
        - { name: capability, in: path, required: true, schema: { type: string }, description: "The capability returned by POST /artifacts/{id}/capability." }
      responses:
        "200":
          description: the bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Problem" }
  /capabilities:
    post:
      operationId: mintPathCapability
      summary: Mint a short-lived capability over a SET of artifacts, addressed by path
      description: |
        The many-artifact form of `POST /artifacts/{id}/capability`. The caller supplies
        `{path, artifactId}` pairs and the runtime indexes them behind one capability, so a set of
        files can be served as a browsable tree at `GET /w/{capability}/{path}` without the runtime
        learning what the set IS: a workspace is one caller of this, not a concept in the server.

        Every entry is authorized as a `read_one` on that artifact before the capability is minted,
        including the caller's pattern scope; an artifact outside the caller's scope answers 404
        rather than 403, so a mint cannot become an existence oracle. Capabilities are in-memory and
        short-lived, so a URL carrying one does not survive a restart and belongs in an `<img>`
        rather than in a transcript. At most 5000 entries.
      x-stability: experimental
      x-phase: "M1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items:
                    type: object
                    required: [path, artifactId]
                    properties:
                      path: { type: string, description: "The path this artifact answers to inside the tree." }
                      artifactId: { $ref: "#/components/schemas/Ulid" }
      responses:
        "201":
          description: the capability, when it lapses, and an absolute URL for the tree root
          content:
            application/json:
              schema:
                type: object
                properties:
                  capability: { type: string }
                  expiresAt: { type: string, format: date-time }
                  entries: { type: integer, description: "How many paths the capability indexes." }
                  url: { type: string, description: "Absolute; a relative one is unopenable by anything but the console." }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /w/{capability}/{path}:
    get:
      operationId: getTreeFileByCapability
      summary: One file from a path-addressed capability (the browsable form)
      description: |
        Serves the artifact registered under `path` in the capability minted by `POST
        /capabilities`. `w` is for the shape a caller sees (a working tree), not for anything the
        runtime knows about one. A bare directory serves `index.html`, the one convention a site
        needs and the only one; `favicon.ico` answers 204 rather than 404, because a browser asks
        for it on every navigation and a 404 fills the console with a warning that reads like a
        real fault.

        No Authorization header: the capability IS the authorization, and none is accepted. Path
        lookup is an exact match in a fixed index, so traversal is not defended against because it
        cannot happen — `..`, an absolute path and an encoded separator all simply miss.
      x-stability: experimental
      x-phase: "M1"
      parameters:
        - { name: capability, in: path, required: true, schema: { type: string }, description: "The capability returned by POST /capabilities." }
        - { name: path, in: path, required: true, schema: { type: string }, description: "A path inside the tree; a trailing slash resolves index.html." }
      responses:
        "200":
          description: the bytes, with the artifact's media type
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "204": { description: "favicon.ico, which no tree contains" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /artifacts/{id}/capability:
    post:
      operationId: artifactCapability
      summary: Mint a short-lived download capability for one artifact
      description: |
        For contexts that cannot attach an Authorization header, such as an `<img src>` in a browser. The
        capability is scoped to a single artifact, expires in minutes, and is minted only for a
        caller already authorized to read it. It is a delegation of that read, not a credential.
        Returns 16 random bytes as base64url (22 characters): the token opens one object for a few
        minutes and is not an identity, so its length is chosen for the URL a person has to handle.
      x-stability: stable
      x-phase: "M1"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "201":
          description: minted
          content:
            application/json:
              schema:
                type: object
                required: [capability, expiresAt, url]
                properties:
                  capability: { type: string }
                  expiresAt: { type: string, format: date-time }
                  url: { type: string, description: "ready-to-open download URL: the short `/v0/a/{capability}` form, absolute against the isolated artifact origin when one is configured, otherwise space-relative" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /ops/remediate:
    post:
      operationId: remediate
      summary: Remediate every record matching an envelope selector
      description: |
        Selector-driven remediation, as opposed to `POST /ops/records/{id}/{action}` one id at a
        time. The selector is the same shape `GET /ops/records` accepts, so diagnosing and fixing
        share one vocabulary: `{state: leased, expired: true}` is the stuck-lease set in both.

        Every transition is state-guarded per record, so this is safe to re-run and safe to race
        with a worker that returns: a record that has moved on is simply not applied. Bounded by
        `limit`; `more` reports that the page was full, so a caller draining a backlog repeats
        until it is false.
      x-stability: experimental
      x-phase: "M1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, state]
              properties:
                action: { type: string, enum: [reclaim, dead-letter, requeue] }
                state: { type: string, enum: [available, leased, consumed, dead_letter] }
                expired: { type: boolean, description: "With state=leased: only leases that have lapsed." }
                stale: { type: integer, description: "With state=available: only first-attempt records unclaimed for this many seconds." }
                limit: { type: integer, default: 200, description: "Max records to act on (max 2000)." }
      responses:
        "200":
          description: applied
          content:
            application/json:
              schema:
                type: object
                required: [action, matched, applied, more]
                properties:
                  action: { type: string }
                  matched: { type: integer }
                  applied: { type: integer, description: "matched minus those a guard skipped (already moved on)" }
                  more: { type: boolean }
                  sample: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /ops/gc:
    post:
      operationId: gc
      summary: Run the retention sweep
      description: |
        Delete records whose `retention_until` has passed. The second deliberate carve-out from
        immutability, after artifact erasure, and shaped the same way: the content goes, the
        evidence stays (the event log keeps every swept record's id, kind, digest and transitions,
        plus one `gc` event per swept kind per batch). The runtime stamps only what was declared:
        an explicit `retentionUntil` on the put, else the kind_def's `defaultRetentionSeconds`
        materialized at commit; a record with neither is permanent. Aged idempotency rows sweep in
        the same pass.

        Never swept: records under an unexpired lease, `available` work of claimable kinds
        (unclaimed work is not litter), reserved kinds, and `artifact` records (until blob GC
        exists). Reference kinds (`claimable: false`) sweep from any state, since they sit
        `available` forever by design.

        Never on a timer: this verb, plus an amortized batch the write path itself runs every
        `gcEveryWrites` commits. `radia doctor` reports the backlog (`sweepable`); `dryRun` counts
        without deleting. Operator-only. See agent_docs/plan-gc.md.
      x-stability: experimental
      x-phase: "M2"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit: { type: integer, default: 1000, description: "Batch size (max 10000); up to 50 batches per call." }
                dryRun: { type: boolean, description: "Count eligibility, delete nothing." }
                compact: { type: boolean, default: true, description: "Also compact latest-wins registries: delete entries strictly older than the newest per content key (tombstones kept — deleting a retire-marker would silently undo the withdrawal), and interests whose run is over. Kinds opt in by declaring `contentKey` on their kind_def; grant/kind_def/signal/agent_definition never compact." }
      responses:
        "200":
          description: swept
          content:
            application/json:
              schema:
                type: object
                required: [swept, eligible, idempotency, byKind, more, passes]
                properties:
                  swept: { type: integer, description: "Records deleted (0 on dryRun)." }
                  eligible: { type: integer }
                  idempotency: { type: integer, description: "Aged idempotency rows swept (rows of unknown age never are)." }
                  byKind: { type: object, additionalProperties: { type: integer } }
                  more: { type: boolean, description: "A backlog remains; call again. Never read a capped count as the total." }
                  passes: { type: integer }
                  compaction:
                    type: object
                    required: [compacted, superseded, byKind, more]
                    properties:
                      compacted: { type: integer }
                      superseded: { type: integer }
                      byKind: { type: object, additionalProperties: { type: integer } }
                      more: { type: boolean }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /watches:
    post:
      operationId: watch
      summary: Create an ephemeral, pattern-scoped watch
      description: "The stream (below) starts from the event seq at creation. Watches die with the runtime; durable subscriptions are deferred."
      x-stability: stable
      x-phase: "M1"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Pattern" }
      responses:
        "201":
          description: watch created
          content:
            application/json:
              schema:
                type: object
                properties: { watchId: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429":
          description: >
            `too_many_watches`: this principal already holds the maximum. A watch is dropped after
            its idle window with nothing attached, so the usual fix is to close streams you are done
            with — or to reuse ONE watch across reconnects with `Last-Event-ID`, which is what the
            cursor is for. Refused rather than evicting somebody's oldest watch, which would kill a
            live stream to serve a new one.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /watches/{watchId}/events:
    get:
      operationId: watchEvents
      summary: SSE stream of wakeups for matching, available records
      description: >
        text/event-stream. Each wakeup: `id: <seq>` and `data: {seq, recordId, kind}`.
        Resume with `Last-Event-ID` (or `?cursor=`); delivery continues after that seq.
        An explicit cursor older than the retained event log returns 410 cursor_expired,
        with `horizon` (resume from it after re-syncing by query) and `swept` in the
        problem body. The sentinel `0` (or no cursor) NEVER 410s: it starts from the
        oldest retained event, which is how a client recovers after a 410. The event
        sweep that creates a horizon is M2; until then the check finds nothing to refuse.


        AUTHORIZATION IS RE-CHECKED FOR AS LONG AS THE STREAM RUNS, not only when it opens:
        the credential is re-resolved and the watch's grant scope re-derived, so a revoked
        or narrowed grant takes effect on the live connection. A stream whose authorization
        has gone ends with a single `event: revoked` frame carrying `data: {reason}`
        (`forbidden` or `credential_invalid`), then closes. Attaching (including a
        `Last-Event-ID` reconnect) re-authorizes too, so 403 is a valid response to a watch
        the caller created: ownership is not authorization. Clients MUST treat both as
        terminal; retrying cannot succeed. A `revoked` frame is control, never a wakeup, so
        a client that ignores the `event:` field would otherwise parse it as one.
      x-stability: stable
      x-phase: "M1"
      parameters:
        - { name: watchId, in: path, required: true, schema: { type: string } }
        - { name: cursor, in: query, required: false, schema: { type: integer } }
        - { name: Last-Event-ID, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }

  # --- bootstrap chain (auth): definition -> run token -> stop. EXPERIMENTAL --------------
  # Requests authenticate with `Authorization: Bearer <run-token>` (a run:* principal that
  # inherits its agent definition's grants). That is the only auth channel. `radia dev` requires
  # one by default; the explicit `--auth open` makes a credential-less request the operator
  # `human:local` instead. See design-auth.md. Definitions/runs are records (agent_definition/agent_run); only the
  # token HASH is stored; the plaintext token is returned once and never persisted.

  /agent-definitions:
    post:
      operationId: createAgentDefinition
      summary: Create an agent definition and assign its grants (operator only)
      x-stability: experimental
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent]
              properties:
                agent: { type: string, description: "the principal this definition mints runs for: agent:* for a worker, human:* for a person (radia login). A human: principal is NOT privileged by its name; privilege is the space's named operator set." }
                grants: { type: array, items: { $ref: "#/components/schemas/GrantDef" } }
      responses:
        "201":
          description: created (definitionToken shown once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent: { type: string }
                  definitionToken: { type: string }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /agent-runs:
    post:
      operationId: createAgentRun
      summary: Mint a short-lived run token from a definition token
      description: "Present the definition token as `Authorization: Bearer`. Returns a run:* principal + run token (once)."
      x-stability: experimental
      responses:
        "201":
          description: run minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  run: { type: string }
                  agent: { type: string }
                  runToken: { type: string }
                  expiresAt: { type: string }
        "401": { $ref: "#/components/responses/Problem" }

  /agent-runs/{runId}/renew:
    post:
      operationId: renewRun
      summary: Extend a live run's expiry, presenting its own token
      description: |
        Run tokens are short so a LEAKED one stops working, which left every long-running process
        dying mid-task. Renewal writes a successor `agent_run` carrying the same token hash and a
        later `expiresAt`, so the token already in the holder's hand keeps resolving.

        Three bounds, and all three matter. A STOPPED run cannot be revived, so revocation still
        wins. Renewal never extends past `mintedAt + runMaxLifetimeSeconds`, so a leaked token dies
        on a fixed schedule and getting past it needs authentication. And an EXPIRED token is
        rejected before this handler sees it (401), which is why a client renews at half-life rather
        than on failure. Stopped or aged-out is 409: a closed door, not a retryable error.
      x-stability: experimental
      x-phase: "M1"
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: extended
          content:
            application/json:
              schema:
                type: object
                required: [run, agent, expiresAt, maxLifetimeAt]
                properties:
                  run: { type: string }
                  agent: { type: string }
                  expiresAt: { type: string, format: date-time }
                  maxLifetimeAt: { type: string, format: date-time, description: "the ceiling renewal may never pass" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /agent-definitions/{agent}/revoke:
    post:
      operationId: revokeDefinition
      summary: Kill a definition token, permanently (operator only)
      description: >-
        A definition token mints run tokens and never expires, so a leak had no remedy: rotating the
        subject left the old definition working beside the new one. Revoking writes a successor
        carrying the same token hash, so the credential stops resolving in the one indexed lookup
        authentication already performs. Existing RUNS are untouched and are separately revocable
        with the run stop endpoint — this stops new authority being handed out, it does not kill work
        in flight. Idempotent: `alreadyRevoked` distinguishes the second call from the first.
      x-stability: experimental
      parameters:
        - { name: agent, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, description: Recorded on the revocation record. }
      responses:
        "200":
          description: "{agent, status, applied, alreadyRevoked}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent: { type: string }
                  status: { type: string, enum: [revoked] }
                  applied: { type: boolean }
                  alreadyRevoked: { type: boolean }
        "403": { description: revoking a definition requires an operator }
        "404": { description: no definition for that principal }

  /agent-runs/{runId}/stop:
    post:
      operationId: stopAgentRun
      summary: Stop a run (operator or the run's own definition/run token)
      description: >
        The run's token stops resolving. Graceful by default (held leases expire on their own
        clocks); `{quarantine: true}` is emergency revocation, so the run's in-flight leases are
        force-released now (epoch-bumped), so a late ack/renew fences out as lease_lost.
      x-stability: experimental
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { quarantine: { type: boolean, default: false } }
      responses:
        "200":
          description: stopped
          content:
            application/json:
              schema:
                type: object
                properties: { run: { type: string }, status: { type: string }, applied: { type: boolean }, quarantined: { type: integer, description: "leases force-released (0 unless quarantine)" } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  # --- observability/control plane (/ops/*): EXPERIMENTAL --------------------------------
  # /v0/ops/* is the observe-and-operate plane (stats, events, diagnostics, record + envelope
  # introspection, remediation); grant-gated to human/supervisor principals with real auth.
  #
  # There is NO /kinds endpoint. A kind declaration is a record of the reserved `kind_def`
  # kind (body = a KindDef): declare a kind with `POST /records` {kind: kind_def, body: <KindDef>}
  # and discover kinds with `POST /records/query` {kind: kind_def}. Expressing kinds through the
  # substrate (records + query) rather than a bespoke endpoint. See CLAUDE.md "Design principle".
  # Re-declaring a kind emits a successor record (records are immutable; latest per name wins).
  #
  # Likewise there is NO /grants endpoint. Reserved kinds `grant` (body {principal, kind,
  # operations}; kind-scoped, never wildcard) and `signal` are records too, WRITE-PROTECTED to
  # operator principals: a human/supervisor `POST /records` {kind: grant, ...} assigns a grant;
  # `Space.authorize` discovers it by query. Non-operators get 403 on grant/signal writes and on
  # any /ops/* path. See design-auth.md.

  /ops/records:
    get:
      operationId: envelopeQuery
      summary: Query records by runtime envelope state (leased/available/…), the dimension the content-routing query omits
      description: >
        The ops-plane substrate primitive for observability: filter by envelope `state`, plus
        optional `expired` (lease has lapsed) and `stale` (seconds sat available). Diagnostics is
        a composition of these. Returns records with their envelopes.
      x-stability: experimental
      parameters:
        - { name: state, in: query, required: true, schema: { type: string, enum: [available, leased, consumed, dead_letter] }, description: "NOT `expired`: a lapsed lease stays `leased`. Ask for expiry with state=leased&expired=1." }
        - { name: expired, in: query, required: false, schema: { type: string, enum: ["1", "true"] } }
        - { name: stale, in: query, required: false, schema: { type: integer }, description: "keep first-attempt available rows older than this many seconds" }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 100, maximum: 500 } }
      responses:
        "200":
          description: records with envelopes
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      type: object
                      properties:
                        record: { $ref: "#/components/schemas/Record" }
                        envelope: { $ref: "#/components/schemas/Envelope" }
        "400": { $ref: "#/components/responses/Problem" }

  /ops/digest:
    get:
      operationId: digest
      summary: "One read that orients an investigator: kinds, counts, who is listening, what you may do"
      description: >
        Generated from records, so it cannot drift from the space it describes. Every registry read
        behind it pages to exhaustion and reports `complete: false` rather than returning a
        plausible prefix, because this is the artifact an inspection agent trusts most. A
        self-scoped caller sees its own interests only; the full interest list is the routing table
        and stays operator-only, like `POST /ops/dry-run`.
      x-stability: experimental
      responses:
        "200":
          description: space digest
          content:
            application/json:
              schema:
                type: object
                properties:
                  api: { type: string }
                  kinds:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string }
                        indexedPaths: { type: array, items: { type: string } }
                        sortablePaths: { type: array, items: { type: string } }
                        claimable: { type: boolean, description: "false means reference data; sitting available forever is normal" }
                        reserved: { type: boolean }
                  counts: { type: array, items: { type: object } }
                  interests:
                    type: array
                    description: "routing topology as an edge list: one row per (kind, agent), never one per pattern"
                    items:
                      type: object
                      properties:
                        kind: { type: string }
                        agent: { type: string }
                        runs: { type: integer, description: "how many live runs of that agent listen" }
                        patterns: { type: integer, description: "how many patterns they registered; ask dry-run which one a record reaches" }
                  interestsWithheld: { type: integer, description: "interests hidden by the caller's scope" }
                  interestsNote: { type: string, description: "present when interests were withheld, so an empty list is not read as an idle fleet" }
                  permissions: { type: object, description: "what the CALLING principal may do" }
                  complete: { type: boolean, description: "false when a registry read was truncated" }

  /ops/dry-run:
    post:
      operationId: dryRun
      summary: Which registered interests would receive a record of this shape (asked before it is written)
      description: >
        Runs the matching direction backwards: many registered patterns against one candidate body,
        rather than one pattern against many records. The body need not describe a record that
        exists, which is the point. Operator-gated: it reports what every principal listens for,
        which is the routing table rather than a self-scoped fact. An interest is reported only
        while its RUN is live, because a crashed worker never retires its own.
      x-stability: experimental
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, description: "the record kind the candidate would be written as" }
                body: { description: "the candidate body; omitted matches interests with no pattern" }
      responses:
        "200":
          description: matching interests
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: { type: string }
                  interests:
                    type: array
                    items:
                      type: object
                      properties:
                        run: { type: string, description: "the run that published it (server-assigned author)" }
                        agent: { type: string, description: "the agent behind that run" }
                        match: { type: object, additionalProperties: true, description: "the interest's match, absent when it takes the whole kind" }
                  complete: { type: boolean, description: "absent unless the registry read was truncated" }
                  note: { type: string, description: "present when nothing matched, distinguishing 'nobody listens' from 'nobody is running'" }
        "400": { $ref: "#/components/responses/Problem" }
  /ops/integrity:
    get:
      operationId: integrity
      summary: Recompute the event chain and report the first divergence
      description: >-
        Each event is sealed into a hash chain once the log's finality watermark passes it, so the
        hot path pays nothing and the most recent activity is always outside the chain (`unsealed`).
        Sealing runs on demand as part of this call. **A chain stored in the database it protects
        detects corruption and careless edits, not a deliberate rewrite**, because anyone who can
        write rows can recompute every hash. `signed: true` means each link carries an HMAC under a
        key that does not live in the database, which is what makes a rewrite detectable; `false`
        says the weaker guarantee is the one in force. Externally anchored checkpoints (M2) are what
        cover an attacker holding the key as well.
      x-stability: experimental
      responses:
        "200":
          description: integrity report
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, description: "the only field to branch on" }
                  checked: { type: integer }
                  sealed: { type: integer, description: "chain length, so `checked: 0` cannot read as verified" }
                  unsealed: { type: integer, description: "committed but not yet final; not a fault" }
                  signed: { type: boolean }
                  head:
                    type: object
                    properties:
                      idx: { type: integer }
                      hash: { type: string }
                  truncated:
                    type: object
                    description: >-
                      present when the chain begins past genesis: event-log GC removed `swept`
                      events below the anchor. `attested` means a sealed horizon statement covers
                      the truncation (honest GC seals one before deleting); an unattested
                      truncation is reported as a failure (`unattested_truncation`), because it is
                      indistinguishable from someone deleting history.
                    properties:
                      anchorIdx: { type: integer }
                      swept: { type: integer }
                      attested: { type: boolean }
                  failure:
                    type: object
                    description: "the FIRST divergence; absent when ok"
                    properties:
                      idx: { type: integer }
                      eventId: { type: string }
                      reason: { type: string, enum: [hash_mismatch, broken_link, missing_event, bad_signature, gap, unattested_truncation] }
                      detail: { type: string }
                  note: { type: string, description: "present when the chain is unsigned" }
                  unsealedNote: { type: string }
                  truncatedNote: { type: string }

  /ops/flows:
    get:
      operationId: flows
      summary: "Recurring shapes of work, mined from lineage: the workflow diagram nobody wrote"
      description: >-
        A content-routed space has no declared topology, so the shape of the work has to be
        RECOVERED rather than read: each causally connected subgraph is abstracted to the sequence
        of `(kind, agent)` along its depth, ids and payloads dropped, and the results grouped.
        Partial subgraphs are input rather than noise, because a shape that reliably starts and
        rarely finishes is the failure signal. Outcomes are mechanical (a `dead_letter` in the
        subgraph, work still claimable, everything settled), never a model's verdict. The two
        granularity parameters exist because neither setting is knowable in advance and a
        mis-set one fails silently: too fine and every run is unique, too coarse and everything is
        one flow.
      x-stability: experimental
      parameters:
        - { name: granularity, in: query, schema: { type: string, enum: [kind, "kind+agent"], default: "kind+agent" }, description: "whether the acting agent is part of a signature token" }
        - { name: counts, in: query, schema: { type: string, enum: [bucketed, exact], default: bucketed }, description: "bucketed fan-out is what makes a four-item and a five-item run the same flow" }
        - { name: max_records, in: query, schema: { type: integer }, description: "cap on the scan; reaching it reports complete:false" }
        - { name: min_occurrences, in: query, schema: { type: integer, default: 1 } }
        - { name: hub_degree, in: query, schema: { type: integer, default: 8 }, description: "children a record needs before it is TESTED as a hub whose removal splits the flow; a same-kind version spine is tested the same way regardless; 0 leaves every component whole" }
        - { name: include_reserved, in: query, schema: { type: boolean, default: false }, description: "include the substrate's own kinds (declarations, grants, run records)" }
        - { name: include_singletons, in: query, schema: { type: boolean, default: false }, description: "include records linked to nothing; they are counted in `singletons` either way" }
      responses:
        "200":
          description: mined flows
          content:
            application/json:
              schema:
                type: object
                properties:
                  granularity: { type: string }
                  counts: { type: string }
                  flows:
                    type: array
                    items:
                      type: object
                      properties:
                        signature: { type: string, description: "e.g. `job → task×4-7 → result×4-7 → summary`; a leading `…` marks a fragment" }
                        occurrences: { type: integer }
                        outcomes:
                          type: object
                          properties:
                            complete: { type: integer }
                            open: { type: integer }
                            failed: { type: integer }
                        successRate: { type: number }
                        medianDurationMs: { type: integer }
                        medianRecords: { type: integer }
                        exemplars: { type: array, items: { type: string }, description: "roots of the newest occurrences, for a thread read" }
                  scanned:
                    type: object
                    properties:
                      records: { type: integer }
                      kinds: { type: array, items: { type: string } }
                      subgraphs: { type: integer }
                  fragments: { type: integer, description: "subgraphs with a parent outside the scan, whose signature is a prefix of the truth" }
                  singletons: { type: integer, description: "records linked to nothing: counted always, listed only with include_singletons" }
                  hubs: { type: integer, description: "hub records cut out so the work hanging off them could be mined separately; the `X ⇒` prefix on a signature names what it hung from" }
                  complete: { type: boolean }
                  notes: { type: array, items: { type: string } }
                  scope: { type: object, description: "present when the caller is self-scoped" }
                  note: { type: string, description: "present when nothing was mined, distinguishing an idle space from unlinked work" }
        "400": { $ref: "#/components/responses/Problem" }

  /ops/diagnostics:
    get:
      operationId: diagnostics
      summary: Derived health report covering counts, dead-letters, stuck leases, stale-available, and erasures that no longer hold (dev console)
      x-stability: experimental
      responses:
        "200":
          description: diagnostics
          content:
            application/json:
              schema:
                type: object
                properties:
                  now: { type: string }
                  counts: { type: object, additionalProperties: { type: integer } }
                  deadLetter: { type: object }
                  stuckLeases: { type: object }
                  staleAvailable:
                    type: object
                    description: >-
                      Unclaimed work older than the threshold. `split` separates the two causes age
                      alone conflates: `orphaned` (no live interest matches, so waiting never helps)
                      and `starving` (a listener matches and is not claiming). ABSENT when the space
                      publishes no live interests at all, because then every record would look
                      orphaned and that describes the fleet's instrumentation rather than its work.
                  undoneErasures:
                    type: object
                    description: >-
                      Erasures whose payload is readable again. ABSENT for a scoped caller rather
                      than zero: shred records are operator-visible, so a `0` would be reassurance
                      on no evidence.
                  integrity:
                    type: object
                    description: >-
                      The event chain's verdict, same shape as `GET /ops/integrity`. ABSENT for a
                      scoped caller, for the same reason as `undoneErasures`: the chain covers every
                      principal's activity.

  /ops/erasures:
    get:
      operationId: erasures
      summary: Every shred, and whether its payload is still gone
      description: >-
        A shred destroys the runtime's COPY, not the ability to store those bytes: the content
        address stays valid, so anyone holding the payload can write it again and every record
        referencing it reads once more. `holds:false` marks an erasure that was reversed. Refusing
        such a write would poison a content address for the whole space, and refusing to serve the
        shredded record while identical bytes are readable through a newer one would protect the
        paper trail rather than the person; reporting the true state is the answer instead.
      x-stability: experimental
      parameters:
        - name: undone
          in: query
          required: false
          schema: { type: string, enum: ["true"] }
          description: Only the erasures that no longer hold.
      responses:
        "200":
          description: "{erasures, checked, complete}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  erasures:
                    type: array
                    items:
                      type: object
                      properties:
                        shredId: { type: string }
                        artifactId: { type: string }
                        digest: { type: string }
                        reason: { type: string }
                        at: { type: string }
                        method: { type: string, enum: [delete, crypto-shred] }
                        holds: { type: boolean }
                  checked: { type: integer }
                  complete:
                    type: boolean
                    description: False means the list is a PREFIX; an empty result then does not mean every erasure holds.

  /ops/records/{recordId}/{action}:
    post:
      operationId: adminRemediate
      summary: Control-plane remediation (bypasses lease fencing; grant-gated with real auth)
      description: "`action` is reclaim (un-stick an EXPIRED lease → available, attempt+1), dead-letter, or requeue (dead_letter → available). Returns {applied}."
      x-stability: experimental
      parameters:
        - { name: recordId, in: path, required: true, schema: { type: string } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [reclaim, dead-letter, requeue] } }
      responses:
        "200":
          description: "{action, recordId, applied}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  action: { type: string }
                  recordId: { type: string }
                  applied: { type: boolean }
        "404": { $ref: "#/components/responses/Problem" }

  /ops/records/{recordId}/declassify:
    post:
      operationId: declassify
      summary: Privileged declassify that clears taint by emitting a clean successor (operator only)
      description: >
        Records are immutable, so declassify emits a NEW record with the same kind + body,
        the named labels removed (or all of them when none are named), and the original as its data
        parent (audit trail). The only way to clear a label. The response and the event both record
        which labels were `cleared` and which `remaining`, so a clearance says what it was FOR.
        Grant-gated to operators via the /ops boundary.
      x-stability: experimental
      parameters:
        - { name: recordId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        description: "Omit the body (or `labels`) to clear every label the record carries."
        content:
          application/json:
            schema:
              type: object
              properties:
                labels:
                  type: array
                  items: { type: string }
                  description: "Which labels to clear. Unrecognized labels are a 400: the vocabulary is closed."
      responses:
        "200":
          description: "{declassifiedFrom, id, cleared, remaining}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  declassifiedFrom: { type: string }
                  id: { type: string, description: "The successor carrying whatever was not cleared." }
                  cleared: { type: array, items: { type: string } }
                  remaining: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /ops/records/{recordId}/shred:
    post:
      operationId: shredArtifact
      summary: Destroy an artifact's bytes, keeping the record (operator only)
      description: |
        The one carve-out from immutability. Records are never deleted, and erasure is a real
        requirement (a subject exercising a right, a secret written by accident, a retention
        deadline), so what is destroyed is the PAYLOAD: the artifact record, its id, its digest, its
        lineage and every event survive. The content address stays valid because the digest is over
        plaintext, so the space still says "an artifact with this digest was here, and was erased".

        Under a space KEK this is crypto-shredding (the per-blob key is destroyed before the
        ciphertext, so an interrupted erase leaves unreadable bytes); without one it is a plain
        delete. The response says which, because only the first excludes recovery from a copy of the
        storage.

        Erasure is by CONTENT. The store is content-addressed, so identical payloads are one blob
        that several artifact records reference and erasing it erases it for all of them: a shared
        payload is refused with 409 unless `acknowledgeShared` is set. A subsequent read of the
        bytes is 410, never 404, so "erased" and "never existed" stay distinguishable.
      x-stability: experimental
      x-phase: "M1"
      parameters:
        - { name: recordId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, description: "Recorded on the shred marker, so the WHY is auditable." }
                acknowledgeShared: { type: boolean, description: "Required when more than one artifact record references this content." }
      responses:
        "200":
          description: erased
          content:
            application/json:
              schema:
                type: object
                required: [artifact, digest, references, encrypted, alreadyGone, note]
                properties:
                  artifact: { type: string }
                  digest: { type: string }
                  references: { type: integer, description: "artifact records that referenced this content; all of them lose it" }
                  encrypted: { type: boolean, description: "true = crypto-shred (key destroyed); false = plain delete" }
                  alreadyGone: { type: boolean, description: "the bytes were already absent; the erasure is now recorded" }
                  note: { type: string }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /ops/stats:
    get:
      operationId: stats
      summary: Record counts by kind and state (dev console)
      x-stability: experimental
      responses:
        "200":
          description: stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  stats:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string }
                        state: { type: string }
                        count: { type: integer }

  /ops/events:
    get:
      operationId: events
      summary: Append-only event log after a seq (dev console / audit)
      x-stability: experimental
      parameters:
        - { name: after, in: query, required: false, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 200, maximum: 500 } }
      responses:
        "200":
          description: >
            events. A page starting below the event-GC horizon begins at the oldest retained
            event (never a 410 here, unlike the watch stream: a refusal would permanently break
            every from-zero read after the first sweep) and carries `logBeginsAfter` +
            `sweptBefore` so the truncation is visible rather than silent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/Event" } }
                  logBeginsAfter: { type: string, description: The truncation horizon cursor; the log is complete after it. }
                  sweptBefore: { type: integer, description: How many events event-log GC removed below the horizon. }

  /ops/records/{recordId}/envelope:
    get:
      operationId: getEnvelope
      summary: The mutable runtime envelope for a record (dev console)
      x-stability: experimental
      parameters:
        - { name: recordId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: envelope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "404": { $ref: "#/components/responses/Problem" }

  /ops/records/{recordId}:
    get:
      operationId: getRecord
      summary: A single record by id (dev console)
      x-stability: experimental
      parameters:
        - { name: recordId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
        "404": { $ref: "#/components/responses/Problem" }

  /ops/records/{recordId}/lineage:
    get:
      operationId: lineage
      summary: A record and its ancestry via parent_ids (dev console)
      x-stability: experimental
      parameters:
        - { name: recordId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: lineage
          content:
            application/json:
              schema:
                type: object
                properties:
                  lineage:
                    type: array
                    items:
                      type: object
                      properties:
                        record: { $ref: "#/components/schemas/Record" }
                        depth: { type: integer }
        "404": { $ref: "#/components/responses/Problem" }

  /ops/permissions:
    get:
      operationId: permissions
      summary: What a principal can actually do, the fold over its grants, computed and shown
      description: >
        Effective permission is a fold over an unbounded record set: union across grants, per
        operation, self-scope applied only when every grant permitting that read is scoped, and
        retirement applied after newest-per-key. Recomputing that inside each decision left no way
        to check it, and every grant defect so far has been a promise that did not match the
        enforcement. Operator only, because reading another principal's authorization is not something a
        self scope may reach. `complete: false` means the grant scan could not be exhausted and the
        view may be missing entries.
      x-stability: experimental
      parameters:
        - { name: principal, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: effective permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  principal: { type: string }
                  subject: { type: string, description: The agent a run resolves to. }
                  privileged: { type: boolean }
                  complete: { type: boolean }
                  ops:
                    type: object
                    properties:
                      reachable: { type: boolean }
                      kinds: { type: array, items: { type: string } }
                  kinds:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string }
                        operations: { type: array, items: { type: string } }
                        readsScopedToSelf: { type: boolean }
                        patterns: { type: array, items: { type: object } }
        "400": { $ref: "#/components/responses/Problem" }

  /ops/records/{recordId}/children:
    get:
      operationId: children
      summary: Records that reference this one via parent_ids, its children (the reverse of lineage)
      description: >
        Lineage walks parent_ids UP (ancestors); this returns records that name this id as a parent
        (DOWN), e.g. a conversation's messages, an llm_call's chunks + result. BOUNDED and keyset-
        paged, by the same contract as the record query: fan-out is unbounded in principle (a child
        per message, a result per task), so this is a PAGE. `after` is the last child id of the
        previous one, and `nextAfter` is absent on the last page.
      x-stability: experimental
      parameters:
        - { name: recordId, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
        - { name: after, in: query, schema: { type: string }, description: Exclusive child-id cursor. }
      responses:
        "200":
          description: children
          content:
            application/json:
              schema:
                type: object
                properties:
                  children: { type: array, items: { $ref: "#/components/schemas/Record" } }
                  nextAfter: { type: string, description: Cursor for the next page; absent on the last. }

  /ops/records/{recordId}/thread:
    get:
      operationId: thread
      summary: "The causally ordered story around a record: its lineage root, then everything descended from it"
      description: >
        A composition of lineage and children so no caller re-implements the walk or its paging.
        Ordered by id, which is creation order. Reports `truncated` when the node cap was hit,
        because a partial story read as a whole one is the failure this verb exists to prevent.
      x-stability: experimental
      parameters:
        - { name: recordId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: the thread
          content:
            application/json:
              schema:
                type: object
                properties:
                  root: { type: string }
                  records: { type: array, items: { $ref: "#/components/schemas/Record" } }
                  truncated: { type: boolean }
                  note: { type: string }
        "404": { $ref: "#/components/responses/Problem" }

  /ops/records/{recordId}/graph:
    get:
      operationId: graph
      summary: The parent_ids relationship graph around a record (dev console)
      description: "BFS over parents and children; `?exclude=kind,kind` skips noisy kinds (e.g. llm_chunk)."
      x-stability: experimental
      parameters:
        - { name: recordId, in: path, required: true, schema: { type: string } }
        - { name: exclude, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: "{nodes, edges}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        kind: { type: string }
                        label: { type: string }
                        createdAt: { type: string }
                  edges:
                    type: array
                    items:
                      type: object
                      properties: { from: { type: string }, to: { type: string } }
        "404": { $ref: "#/components/responses/Problem" }

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Replay-safe key; checked BEFORE lease validation. Reuse with a different request -> 409.
      schema: { type: string }

  responses:
    Problem:
      description: RFC 9457 problem+json
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      description: RFC 9457 problem+json. FROZEN v0-stable.
      x-stability: stable
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    PutRequest:
      description: The only fields a client may submit. Authoritative metadata is server-assigned.
      x-stability: stable
      type: object
      required: [kind]
      properties:
        kind: { type: string }
        body: {}
        clientMeta: { type: object, additionalProperties: true, description: "claims (confidence, requested_priority); never trusted" }
        parentIds: { type: array, items: { type: string }, description: "data lineage; all must exist at commit" }
        deadlineAt: { type: string }
        retentionUntil: { type: string }
        taint: { type: array, items: { type: string }, description: "source attestation: classification labels the client RAISES on its own output (file, net, foreign). Monotone, so it needs no trust; an unrecognized label or a non-array is refused rather than ignored, because silently dropping one leaves a caller believing it restricted a record that is in fact unrestricted. Never subtracts: labels inherited from data parents survive an empty raise." }

    Record:
      description: Immutable content half of a record.
      x-stability: stable
      type: object
      properties:
        id: { type: string }
        kind: { type: string }
        body: {}
        bodySha256: { type: string, description: "sha256 over plaintext body" }
        clientMeta: { type: object, additionalProperties: true }
        runtimeMeta: { $ref: "#/components/schemas/RuntimeMeta" }
        deadlineAt: { type: string }
        retentionUntil: { type: string }

    RuntimeMeta:
      description: Server-assigned, authoritative. Never client-editable.
      x-stability: stable
      type: object
      properties:
        createdBy: { type: string }
        delegationContext:
          type: object
          nullable: true
          description: "authority chain, server-derived from the lease (ack-emitted work); absent for direct/root puts"
          properties:
            chain: { type: array, items: { type: string }, description: "ordered grant subjects (agents) along the delegation path" }
            origin: { type: string, description: "the leased record this was delegated from" }
        parentIds: { type: array, items: { type: string } }
        taint: { type: array, items: { type: string }, description: "server-computed classification: the UNION of every data parent's labels plus the client's raise, plus `foreign` when a parent was written by another principal. Sorted and deduplicated. Cleared only by a privileged declassify, per label." }
        schemaVersion: { type: integer }
        createdAt: { type: string }

    Envelope:
      description: Mutable claim-state envelope, one per record.
      x-stability: stable
      type: object
      properties:
        recordId: { type: string }
        kind: { type: string }
        state: { type: string, enum: [available, leased, consumed, dead_letter] }
        attempt: { type: integer }
        availableAt: { type: string }
        claimUntil: { type: string }
        deadlineAt: { type: string }
        effectivePriority: { type: integer }
        leaseId: { type: string }
        leaseEpoch: { type: integer }
        leaseOwner: { type: string }
        leasedUntil: { type: string }

    Lease:
      description: A fenced lease. Presented (recordId+leaseId+epoch) to settle.
      x-stability: stable
      type: object
      properties:
        leaseId: { type: string }
        epoch: { type: integer }
        ownerRun: { type: string }
        recordId: { type: string }
        expiresAt: { type: string }

    TakeResult:
      x-stability: stable
      type: object
      properties:
        record: { $ref: "#/components/schemas/Record" }
        lease: { $ref: "#/components/schemas/Lease" }

    SettleResult:
      description: nack/release outcome. lease_lost is a non-error status.
      x-stability: stable
      type: object
      properties:
        status: { type: string, enum: [ok, lease_lost] }

    AckResult:
      x-stability: stable
      type: object
      properties:
        status: { type: string, enum: [ok, lease_lost] }
        resultId: { type: string }

    RenewResult:
      x-stability: stable
      type: object
      properties:
        status: { type: string, enum: [ok, lease_lost] }
        lease: { $ref: "#/components/schemas/Lease" }

    Pattern:
      description: >
        kind + optional match + order_by. `match` values are implicit-$eq scalars or
        operator objects ($eq, $gt/$gte/$lt/$lte, $in, $exists, $any/$each, $and/$or depth<=3).
        Divergences: missing != null, no type coercion, explicit array quantifiers. Predicate
        paths must be declared indexed; order_by paths must be declared sortable.
      x-stability: stable
      type: object
      required: [kind]
      properties:
        kind: { type: string }
        match: { type: object, additionalProperties: true }
        orderBy:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              dir: { type: string, enum: [asc, desc] }

    KindDef:
      description: >
        Per-kind indexing contract. This is the BODY of a `kind_def` record. Declare a kind by
        putting one (there is no /kinds endpoint). EXPERIMENTAL.
      x-stability: experimental
      type: object
      required: [kind, indexedPaths]
      properties:
        kind: { type: string }
        indexedPaths:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              type: { type: string, enum: [keyword, integer, timestamp, array] }
        sortablePaths: { type: array, items: { type: string } }
        claimable: { type: boolean, default: true, description: "records of this kind are claimed as work (take); false = reference data (facts/config/history, never taken), and excluded from the starvation diagnostic" }

    GrantDef:
      description: >
        A kind-scoped authorization grant. This is the BODY of a `grant` record (writable only by
        an operator, meaning a human or supervisor). Kind is never wildcard. Optional `pattern` narrows
        read/take to `grant ∧ request` (applies to query/read_one/take; put ignores it).
        EXPERIMENTAL.
      x-stability: experimental
      type: object
      required: [principal, kind, operations]
      properties:
        principal: { type: string, description: "the principal the grant is FOR (agent:* or run:*)" }
        kind: { type: string, description: "a concrete record kind, never '*'" }
        operations:
          type: array
          items: { type: string, enum: [put, take, query, read_one] }
        pattern: { type: object, additionalProperties: true, description: "optional match object; the effective query is grant ∧ request" }

    Event:
      description: Append-only event log entry. EXPERIMENTAL shape.
      x-stability: experimental
      type: object
      properties:
        seq: { type: integer }
        id: { type: string }
        ts: { type: string }
        runId: { type: string }
        operation: { type: string }
        recordId: { type: string }
        kind: { type: string }
        state: { type: string }
        detail: { type: object, additionalProperties: true }
