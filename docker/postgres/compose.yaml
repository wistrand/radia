# Local Postgres for `radia dev --storage postgres` (or `deno task dev:pg`).
#
#   docker compose -f docker/postgres/compose.yaml up -d --wait   # waits until healthy, so
#                                                                  # radia's startup DDL doesn't
#                                                                  # race an unready server
#   deno task dev:pg   # radia dev against postgres://radia:radia@localhost:5432/radia
#
# Data persists in the named volume across `up`/`down`; add `-v` to `down` to wipe it. No
# restart policy — the server runs only while up. Dev-only credentials. This is the persistent
# dev DB — distinct from the throwaway server scripts/pg-conformance.sh starts for the tests.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: radia
      POSTGRES_PASSWORD: radia
      POSTGRES_DB: radia
    ports:
      - "5432:5432"
    volumes:
      - radia-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radia -d radia"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  radia-pgdata:
