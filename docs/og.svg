<?xml version="1.0" encoding="UTF-8"?>
<!-- Source for og.png, the social card. Regenerate after editing:
       rsvg-convert -w 1200 -h 630 docs/og.svg -o docs/og.png
     Monospace is left generic on purpose: this rasterizes on whatever machine runs the command,
     and a font that is not installed silently falls back to something worse than the default. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0e0e11"/>
  <rect x="0" y="0" width="1200" height="6" fill="#818cf8"/>

  <text x="80" y="132" font-family="monospace" font-size="34" font-weight="bold" fill="#e8e8ea">radia</text>

  <text x="80" y="248" font-family="monospace" font-size="52" font-weight="bold" fill="#e8e8ea">Agents claim work</text>
  <text x="80" y="316" font-family="monospace" font-size="52" font-weight="bold" fill="#e8e8ea">instead of being wired</text>
  <text x="80" y="384" font-family="monospace" font-size="52" font-weight="bold" fill="#e8e8ea">to each other.</text>

  <text x="80" y="464" font-family="sans-serif" font-size="26" fill="#9ca3af">A coordination runtime for LLM agents. Adding a worker</text>
  <text x="80" y="502" font-family="sans-serif" font-size="26" fill="#9ca3af">adds a capability, with no code change anywhere else.</text>

  <!-- Four records: three waiting, one claimed. Same figure as the favicon: bright lines on
       dark, the claimed one double-struck. -->
  <g fill="none" stroke="#60a5fa" stroke-width="7">
    <rect x="934" y="174" width="52" height="52" rx="14"/>
    <rect x="1034" y="174" width="52" height="52" rx="14"/>
    <rect x="934" y="274" width="52" height="52" rx="14"/>
  </g>
  <g fill="none" stroke="#a5b4fc" stroke-width="6">
    <rect x="1028" y="268" width="64" height="64" rx="14"/>
    <rect x="1043" y="283" width="34" height="34" rx="7"/>
  </g>

  <text x="80" y="566" font-family="monospace" font-size="22" fill="#6366f1">github.com/wistrand/radia</text>
</svg>
